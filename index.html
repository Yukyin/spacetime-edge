<div id="dbg" style="position:fixed;right:8px;bottom:40px;z-index:30;display:none;font:11px/1.5 ui-monospace,Menlo,monospace;color:#9f9;background:rgba(0,0,0,.75);padding:6px 9px;border-radius:6px;white-space:pre"></div>

<script>
(function(){
'use strict';
// ================================================================ physics (Painlevé-Gullstrand form of Schwarzschild, G = c = M = 1)
// ds^2 = -dt^2 + |dx - v dt|^2, v = -sqrt(2/r) xhat: space flows inward at the local escape speed.
// photon: dx/dt = phat + v, dp/dt = sqrt2 r^-1.5 (p - 1.5 (x.p) x / r^2), E = |p| + v.p is conserved.
const PH = (() => {
  const S2 = Math.SQRT2;
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const len = a => Math.hypot(a[0], a[1], a[2]);
  const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const flow = x => { const r = len(x); return mul(x, -Math.sqrt(2 / r) / r); };
  function deriv(x, p, sgn) {
    const r = len(x), pl = len(p);
    const dx = mul(add(mul(p, 1 / pl), flow(x)), sgn);
    const dp = mul(sub(p, mul(x, 1.5 * dot(x, p) / (r * r))), sgn * S2 * Math.pow(r, -1.5));
    return [dx, dp];
  }
  function boost(n, w) {
    const wl = len(w); if (wl < 1e-9) return n.slice();
    const wh = mul(w, 1 / wl), g = 1 / Math.sqrt(1 - wl * wl);
    return add(n, mul(wh, (g - 1) * dot(n, wh) + g * wl));
  }
  function energy(x, p) { return len(p) + dot(flow(x), p); }
  function trace(x0, p0, sgn, opt) {
    opt = opt || {};
    let x = x0.slice(), p = p0.slice();
    const r0 = len(x0), rEsc = opt.rEsc || Math.max(r0 * 1.05, 60), maxSteps = opt.maxSteps || 800, disk = opt.disk !== false;
    const path = opt.path ? [x.slice()] : null;
    let end = 'lost', minR = r0, hit = null, sweep = 0;
    const e1 = opt.plane ? opt.plane[0] : null, e2 = opt.plane ? opt.plane[1] : null;
    let lastAng = e1 ? Math.atan2(dot(x, e2), dot(x, e1)) : 0;
    for (let i = 0; i < maxSteps; i++) {
      const r = len(x);
      const d0 = deriv(x, p, sgn), drds = dot(x, d0[0]) / r;
      if (r < 0.04) { end = 'center'; break; }
      if (r > 1.9 && r < 2.1 && Math.abs(drds) < 0.03) { end = 'hole'; break; }
      if (r > rEsc && drds > 0) { end = 'sky'; break; }
      const h = 0.04 * r;
      const k1 = d0;
      const k2 = deriv(add(x, mul(k1[0], h / 2)), add(p, mul(k1[1], h / 2)), sgn);
      const k3 = deriv(add(x, mul(k2[0], h / 2)), add(p, mul(k2[1], h / 2)), sgn);
      const k4 = deriv(add(x, mul(k3[0], h)), add(p, mul(k3[1], h)), sgn);
      const xn = add(x, mul(add(add(k1[0], mul(k2[0], 2)), add(mul(k3[0], 2), k4[0])), h / 6));
      const pn = add(p, mul(add(add(k1[1], mul(k2[1], 2)), add(mul(k3[1], 2), k4[1])), h / 6));
      if (disk && x[1] * xn[1] < 0) {
        const t = x[1] / (x[1] - xn[1]), q = add(x, mul(sub(xn, x), t)), rq = len(q);
        if (rq > 6 && rq < 22) { end = 'disk'; hit = q; x = q; if (path) path.push(q); break; }
      }
      x = xn; p = pn; minR = Math.min(minR, len(x));
      if (e1) { const a = Math.atan2(dot(x, e2), dot(x, e1)); let da = a - lastAng; da -= 2 * Math.PI * Math.round(da / (2 * Math.PI)); sweep += da; lastAng = a; }
      if (path) path.push(x.slice());
    }
    return { end, x, p, minR, hit, path, sweep: Math.abs(sweep) };
  }
  // speed of a radial free-faller with energy e relative to the rain observer (outward positive)
  function wFall(e, r) { const b = Math.sqrt(2 / r), q = e * e - 1 + b * b; return (b - e * Math.sqrt(Math.max(q, 0))) / (e * e + b * b); }
  // coordinate time for outgoing radial light: t = F(r) + const, valid for r > 2
  function Fout(r) { const u = Math.sqrt(r); return r + 2 * Math.SQRT2 * u + 4 * Math.log(Math.max(u - Math.SQRT2, 1e-12)); }
  return { add, sub, mul, dot, len, norm, cross, flow, deriv, boost, energy, trace, wFall, Fout };
})();
const V = PH;

// ================================================================ black holes
const BHS = [
  { name: 'Sagittarius A*, centre of the Milky Way, 4.3 million solar masses', short: 'Sgr A*', msun: 4.3e6 },
  { name: 'Gaia BH1, nearest known black hole, about 10 solar masses', short: 'Gaia BH1', msun: 9.6 }
];
let bhi = 0;
const Mlen = () => BHS[bhi].msun * 1476.6;      // metres in 1 M
const Msec = () => BHS[bhi].msun * 4.9255e-6;   // seconds in 1 M
const TEAR = 1000;                               // m/s^2 across the body, roughly 100 g: where a body comes apart
const BODY = 1.8;
const tidal = r => 2 * 8.98755e16 * BODY / (Mlen() * Mlen() * r * r * r);
function fmtLen(m) {
  if (m < 1000) return m.toFixed(0) + ' m';
  const km = m / 1000;
  if (km >= 1e9) return (km / 1e9).toFixed(2) + ' billion km';
  if (km >= 1e6) return (km / 1e6).toFixed(km >= 1e7 ? 0 : 1) + ' million km';
  return (km < 100 ? km.toFixed(1) : Math.round(km).toLocaleString('en-US')) + ' km';
}
function fmtT(s) {
  if (!isFinite(s)) return '∞';
  if (s < 1e-3) return (s * 1e6).toFixed(1) + ' µs';
  if (s < 1) return (s * 1e3).toFixed(2) + ' ms';
  if (s < 60) return s.toFixed(1) + ' s';
  if (s < 86400 * 3) { const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, x = Math.floor(s % 60); return (h ? h + 'h ' : '') + m + 'm ' + x + 's'; }
  if (s < 86400 * 365 * 3) return (s / 86400).toFixed(1) + ' days';
  return (s / 86400 / 365.25).toFixed(1) + ' years';
}
function fmtRate(k) {
  if (k >= 1) return '×' + (k < 10 ? k.toFixed(1) : k < 1e4 ? k.toFixed(0) : k.toExponential(1));
  const inv = 1 / k;
  return '1/' + (inv < 10 ? inv.toFixed(1) : inv < 1e4 ? inv.toFixed(0) : inv.toExponential(1)) + ' speed';
}
function fmtG(a) { const g = a / 9.8; if (g < 1e-3) return g.toExponential(1); if (g < 10) return g.toFixed(3); if (g < 1e4) return g.toFixed(0); return g.toExponential(1); }

// ================================================================ WebGL
const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { antialias: false, depth: false, alpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
if (!gl) { document.getElementById('err').style.display = 'flex'; return; }
const hasFloat = !!gl.getExtension('EXT_color_buffer_float');
gl.getExtension('OES_texture_float_linear');
const ENC = hasFloat ? 0 : 1;
const HEAD = `#version 300 es
precision highp float;
#define ENC ${ENC}
vec3 dec(vec4 c){ return ENC == 1 ? c.rgb / max(1.0 - c.rgb, 1e-3) * 8.0 : c.rgb; }
vec4 enc(vec3 c){ c = min(c, vec3(60000.0)); return ENC == 1 ? vec4(c / 8.0 / (1.0 + c / 8.0), 1.0) : vec4(c, 1.0); }
`;
const VS = `#version 300 es
in vec2 aPos; out vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;
const RT = HEAD + `
in vec2 vUv; out vec4 o;
uniform vec2 uRes; uniform vec3 uPos, uF, uR, uU, uW; uniform float uFy, uTime, uBlend, uSpin, uFish;
uniform vec2 uJit; uniform sampler2D uPrev;
const float RIN = 6.0, ROUT = 22.0, TPK = 6500.0;
float hash13(vec3 p){ p = fract(p * 0.1031); p += dot(p, p.zyx + 31.32); return fract((p.x + p.y) * p.z); }
float vnoise(vec3 p){
  vec3 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = hash13(i), b = hash13(i + vec3(1,0,0)), c = hash13(i + vec3(0,1,0)), d = hash13(i + vec3(1,1,0));
  float e = hash13(i + vec3(0,0,1)), g = hash13(i + vec3(1,0,1)), h = hash13(i + vec3(0,1,1)), k = hash13(i + vec3(1,1,1));
  return mix(mix(mix(a,b,f.x), mix(c,d,f.x), f.y), mix(mix(e,g,f.x), mix(h,k,f.x), f.y), f.z);
}
float fbm(vec3 p){ float s = 0.0, a = 0.5; for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.03 + 7.1; a *= 0.5; } return s; }
vec3 bb(float T){
  T = clamp(T, 1000.0, 40000.0) / 100.0;
  float r = T <= 66.0 ? 1.0 : clamp(1.292936 * pow(T - 60.0, -0.1332047), 0.0, 1.0);
  float g = T <= 66.0 ? clamp(0.3900816 * log(T) - 0.6318414, 0.0, 1.0) : clamp(1.1298909 * pow(T - 60.0, -0.0755148), 0.0, 1.0);
  float b = T >= 66.0 ? 1.0 : (T <= 19.0 ? 0.0 : clamp(0.5432068 * log(T - 10.0) - 1.1962541, 0.0, 1.0));
  return pow(vec3(r, g, b), vec3(2.2));
}
vec3 tintOf(float T){ vec3 t = bb(T); return t / max(max(t.r, t.g), max(t.b, 1e-4)); }
// the sky at infinity, seen with frequency factor g (g > 1 blueshift)
vec3 sky(vec3 d, float g){
